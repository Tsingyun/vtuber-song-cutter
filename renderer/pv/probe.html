<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>JIZURA probe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>html,body{margin:0;background:#111}canvas{display:block;max-width:100vw;height:auto}</style>
</head>
<body>
<!-- 确定性随机：必须在引擎之前。J.Renderer 构造时用 Math.random 生成 grain/paper 纸纹，
     序列不同 ⇒ 同一帧两次渲染不一致。 -->
<script>
(() => {
  let a = 0x5a4e4b4f;
  Math.random = () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
})();
</script>
<script src="vendor/jizura_engine.js"></script>
<script src="jz_adapter.js"></script>
<script>
window.__init = async (cfg) => {
  JZ.setAudio({ duration: cfg.dur, beats: cfg.beats, bpm: cfg.bpm });
  let proj = {
    lyrics: cfg.lrc,
    title: cfg.title || '', artist: cfg.artist || '',
    style: cfg.style || 'noir', seed: cfg.seed || 20261027,
    fps: 30, res: cfg.res || 1080, aspect: '16:9',
    lang: cfg.lang || 'auto',
    unify: true, typeset: true,
    extra: true, wa: false, horror: false, typo: true, kinetic: true,
    schemes: 'dark',
    colors: { accentOn: true, accent: cfg.accent || '#FFB067', ghostA: '#39C6E0', ghostB: '#C8373A' },
    fx: { motion: 0.7, glitch: 0.4, chroma: 0.6, decor: 0.4, density: 0.5,
          texture: 0.5, flash: false, koma: 12, hud: 'off' },
    enabled: cfg.enabled || undefined,
  };
  /* theme：走官方 J.omakase。注意三件事（RULES §117.3）：
     · 它只返回 mood/style/fx/enabled/fonts/colors/overrides/seed —— 必须 Object.assign 回来；
     · 它永远换掉你指定的 style（pool 里排除了当前 style），传 noir 出来是 newsprint 等；
     · 它会丢弃所有非 lock 的 per-line override，所以顺序必须是「先 omakase 再合并」。
     schemes / deny 要在 omakase 之后设，否则会被它的 colors/enabled 覆盖掉。 */
  if (cfg.theme) {
    let s = cfg.themeSeed || 0x9e3779b9;
    const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    Object.assign(proj, J.omakase(proj, rnd, cfg.theme));
  }
  if (cfg.schemes === null) proj.schemes = [0, 1, 2, 3];        // all：让引擎在各套配色间轮换
  else if (cfg.schemes !== undefined) proj.schemes = cfg.schemes;
  /* deny：按 layout 名逐条关掉（默认的 enabled 是「没写 false 就算开」，
     所以只要写 false 即可；不改动其它组）。 */
  if (cfg.deny && cfg.deny.length) {
    proj.enabled = proj.enabled || {};
    proj.enabled.layout = Object.assign({}, proj.enabled.layout);
    for (const k of cfg.deny) proj.enabled.layout[k] = false;
  }
  /* 每句一镜（cfg.single）：
     JIZURA 默认把一句切成 nC = round(D / lerp(1.3, 0.5, density)) 个镜头，每个 0.5~1.3s，
     且每个镜头都各自从空白入场 —— 一句 8 秒的歌词会变成 6 个闪烁的碎块，1.35 秒的短句
     则整段都在做入场动画（用户原话：「十几秒一个场景、中间空框、第一句不完整」）。
     官方解法是 per-line override 的 `single: true`（引擎 3003 行 `if (ov.single || kime) nC = 1`）。
     这里用 Proxy 是因为它按 li 索引取一行一个对象，不必预先知道行数；addPlan 只做
     `project.overrides[li]` 的读取，不展开也不序列化，Proxy 安全。 */
  if (cfg.single) {
    proj.overrides = new Proxy({}, {
      get: (t, k) => (typeof k === 'string' && /^\d+$/.test(k)) ? { single: true } : t[k],
    });
  }
  const sum = await JZ.addPlan('main', proj);
  window.__CUTS = JZ.cutsOf('main');
  return sum;
};
/* mode: transparent | normal | back | front；mime/q 让调用方决定 PNG 还是 JPEG。
   缺省仍是 transparent + PNG —— pv_jz 的原有行为一字不变。 */
window.__shot = (t, mode, mime, q) =>
  JZ.renderTo('main', t, mode || 'transparent').toDataURL(mime || 'image/png', q);
window.__cuts = () => window.__CUTS;
window.__parts = () => JZ.parts();
</script>
</body>
</html>
