<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>JIZURA probe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>html,body{margin:0;background:#111}canvas{display:block;max-width:100vw;height:auto}</style>
</head>
<body>
<!-- 确定性随机：必须在引擎之前。J.Renderer 构造时用 Math.random 生成 grain/paper 纸纹，
     序列不同 ⇒ 同一帧两次渲染不一致。 -->
<script>
(() => {
  let a = 0x5a4e4b4f;
  Math.random = () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
})();
</script>
<script src="vendor/jizura_engine.js"></script>
<script src="jz_adapter.js"></script>
<script>
window.__init = async (cfg) => {
  JZ.setAudio({ duration: cfg.dur, beats: cfg.beats, bpm: cfg.bpm });
  const sum = await JZ.addPlan('main', {
    lyrics: cfg.lrc,
    title: cfg.title || '', artist: cfg.artist || '',
    style: cfg.style || 'noir', seed: cfg.seed || 20261027,
    fps: 30, res: 1080, aspect: '16:9',
    lang: cfg.lang || 'auto',
    unify: true, typeset: true,
    extra: true, wa: false, horror: false, typo: true, kinetic: true,
    schemes: 'dark',
    colors: { accentOn: true, accent: cfg.accent || '#FFB067', ghostA: '#39C6E0', ghostB: '#C8373A' },
    fx: { motion: 0.7, glitch: 0.4, chroma: 0.6, decor: 0.4, density: 0.5,
          texture: 0.5, flash: false, koma: 12, hud: 'off' },
    enabled: cfg.enabled || undefined,
  });
  window.__CUTS = JZ.cutsOf('main');
  return sum;
};
window.__shot = (t, mode) => JZ.renderTo('main', t, mode || 'transparent').toDataURL('image/png');
window.__cuts = () => window.__CUTS;
window.__parts = () => JZ.parts();
</script>
</body>
</html>
