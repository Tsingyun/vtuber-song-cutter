name: ci

# 这个仓库的主体是「要 GPU + 数 GB 录播」的渲染管线，CI 不可能跑出片。
# 所以 CI 只负责一件事：**守住不需要素材就能验的部分** —— 语法、导入、
# 规格唯一真源的单测、字体清单。出片级验收（pv_flash/pv_uniform/pv_check）
# 仍由 tools/check_all.py 与 pv_* 量具在本机执行。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: 语法与导入
        run: |
          python -m compileall -q songcut song_cutter.py auto_cut.py tools
          python -c "from songcut import spec, config, qc; print(spec.describe())"

      - name: 规格单测
        run: python -m pytest tests/test_spec.py -q

      - name: 字体清单
        run: python tools/pv_fonts_audit.py
